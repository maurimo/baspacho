name: Run ctest
description: >
  Runs ctest on a build directory and reports the outcome as job annotations
  (pass/fail summary as a notice, names of failing tests as an error), so that
  results are visible from the checks UI / API without opening the full log.
inputs:
  build-dir:
    description: CMake build directory
    default: build
  args:
    description: Extra arguments passed to ctest (e.g. -E/-R filters, -j)
    default: ""
  label:
    description: Label used in the annotation titles
    default: ctest
runs:
  using: composite
  steps:
    - name: ctest
      shell: bash
      run: |
        set -o pipefail
        ctest --test-dir "${{ inputs.build-dir }}" --output-on-failure --no-tests=error --timeout 1800 \
          ${{ inputs.args }} 2>&1 | tee ctest.log
    - name: annotate
      if: always()
      shell: bash
      run: |
        summary=$(grep -E "tests passed|No tests were found" ctest.log | tail -1 || true)
        echo "::notice title=${{ inputs.label }}::${summary:-ctest did not produce a summary}"
        failed="${{ inputs.build-dir }}/Testing/Temporary/LastTestsFailed.log"
        if [ -s "$failed" ]; then
          echo "::error title=${{ inputs.label }} failures::$(cut -d: -f2- "$failed" | head -60 | paste -sd' ' -)"
        fi
